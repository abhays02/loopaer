<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Loopaer architecture</title><desc id="desc">React and FastAPI loops use sources and a model. The event bus returns updates. MongoDB supports runtime storage. The scripted demo is separate.</desc><rect width="960" height="540" fill="#0b0b0b"/>
    <path d="M24 54 L24 24 L55 25 M905 516 L937 515 L936 484" fill="none" stroke="#76766b" stroke-width="1.5"/>
    <text x="60" y="58" fill="#aaa9a0" font-size="15" font-family="monospace">LOOPAER / FIELD NOTES                                      05 / 05</text>
    <g opacity="1" transform="translate(0 0)">
    <text x="60" y="120" fill="#edede6" font-size="42" font-weight="800" font-family="Cabinet Grotesk, Arial, sans-serif">Keep the boundary honest.</text>
    <g data-architecture="workspace"><path d="M58 176 Q177.5 171 297 174 L295 251 Q177.5 247 60 249 Z" fill="#101010" stroke="#76766b" stroke-width="1.5"/><text x="78" y="218.5" fill="#edede6" font-size="23" font-weight="800" font-family="Cabinet Grotesk, Arial, sans-serif">React workspace</text></g><g data-architecture="runtime"><path d="M353 176 Q475 171 597 174 L595 251 Q475 247 355 249 Z" fill="#101010" stroke="#76766b" stroke-width="1.5"/><text x="373" y="218.5" fill="#edede6" font-size="23" font-weight="800" font-family="Cabinet Grotesk, Arial, sans-serif">FastAPI / loops</text></g><g data-architecture="sources"><path d="M663 176 Q782.5 171 902 174 L900 251 Q782.5 247 665 249 Z" fill="#101010" stroke="#76766b" stroke-width="1.5"/><text x="683" y="218.5" fill="#edede6" font-size="23" font-weight="800" font-family="Cabinet Grotesk, Arial, sans-serif">Sources / model</text></g><g data-architecture="events"><path d="M58 324 Q177.5 319 297 322 L295 399 Q177.5 395 60 397 Z" fill="#101010" stroke="#d4ff00" stroke-width="1.5"/><text x="78" y="366.5" fill="#d4ff00" font-size="23" font-weight="800" font-family="Cabinet Grotesk, Arial, sans-serif">Event bus</text></g><g data-architecture="storage"><path d="M353 324 Q475 319 597 322 L595 399 Q475 395 355 397 Z" fill="#101010" stroke="#76766b" stroke-width="1.5"/><text x="373" y="366.5" fill="#edede6" font-size="23" font-weight="800" font-family="Cabinet Grotesk, Arial, sans-serif">MongoDB</text></g><g data-architecture="demo"><path d="M663 324 Q782.5 319 902 322 L900 399 Q782.5 395 665 397 Z" fill="#101010" stroke="#76766b" stroke-width="1.5"/><text x="683" y="366.5" fill="#edede6" font-size="23" font-weight="800" font-family="Cabinet Grotesk, Arial, sans-serif">Scripted demo</text></g><path d="M302 209 Q325 207 348 209" fill="none" stroke="#76766b" stroke-width="2" pathLength="1" stroke-dasharray="1 1" stroke-linecap="round"/><path d="M602 209 Q630 207 658 209" fill="none" stroke="#76766b" stroke-width="2" pathLength="1" stroke-dasharray="1 1" stroke-linecap="round"/><path d="M474 256 Q476 277 476 315" fill="none" stroke="#76766b" stroke-width="2" pathLength="1" stroke-dasharray="1 1" stroke-linecap="round"/><path d="M355 226 Q178 266 177 315" fill="none" stroke="#d4ff00" stroke-width="2" pathLength="1" stroke-dasharray="1 1" stroke-linecap="round"/><path d="M177 315 Q172 285 177 256" fill="none" stroke="#d4ff00" stroke-width="2" pathLength="1" stroke-dasharray="1 1" stroke-linecap="round"/><path d="M659 361 Q478 430 302 361" fill="none" stroke="#76766b" stroke-width="2" pathLength="1" stroke-dasharray="1 1" stroke-linecap="round"/><text x="70" y="437" fill="#aaa9a0" font-size="15" font-family="monospace">WS /api/ws/{sid}</text><text x="671" y="437" fill="#aaa9a0" font-size="15" font-family="monospace">timed stages only</text><circle cx="177" cy="256" r="5" fill="#d4ff00"/>
    <path d="M59 465 Q480 462 901 465" fill="none" stroke="#41413b"/>
    <text x="60" y="494" fill="#edede6" font-size="19" font-weight="500" font-family="Cabinet Grotesk, Arial, sans-serif">Both engines share events, not the same reasoning.</text>
    <text x="60" y="521" fill="#aaa9a0" font-size="15" font-family="monospace">MongoDB is required for the broader runtime API.</text></g></svg>
